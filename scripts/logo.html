<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 800px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  svg {
    width: 760px;
    height: 760px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1b365d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Shield Body -->
  <g filter="url(#shadow)">
    <!-- Main Outer Shield -->
    <path d="M 400 90
             C 490 90, 570 120, 600 160
             C 600 340, 560 470, 400 550
             C 240 470, 200 340, 200 160
             C 230 120, 310 90, 400 90 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="32" 
          stroke-linejoin="round" />
          
    <!-- Inner Shield Accent Line -->
    <path d="M 400 125
             C 475 125, 540 150, 565 185
             C 565 330, 530 435, 400 505
             C 270 435, 235 330, 235 185
             C 260 150, 325 125, 400 125 Z" 
          fill="none" 
          stroke="#1e3a8a" 
          stroke-width="8" 
          stroke-opacity="0.3" 
          stroke-linejoin="round" />
  </g>

  <!-- Triangular Network inside Shield -->
  <!-- Top Node -->
  <circle cx="400" cy="200" r="28" fill="#ffffff" stroke="url(#shieldGrad)" stroke-width="16" />
  <!-- Bottom Left Node -->
  <circle cx="280" cy="410" r="28" fill="#ffffff" stroke="url(#shieldGrad)" stroke-width="16" />
  <!-- Bottom Right Node -->
  <circle cx="520" cy="410" r="28" fill="#ffffff" stroke="url(#shieldGrad)" stroke-width="16" />

  <!-- Connecting Lines -->
  <path d="M 400 228 L 280 382 M 400 228 L 520 382 M 308 410 L 492 410" 
        stroke="url(#shieldGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Inner 3x3 Grid inside the triangle -->
  <g transform="translate(352, 280)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="36" y="0" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="72" y="0" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <!-- Row 2 -->
    <rect x="0" y="36" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="36" y="36" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="72" y="36" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <!-- Row 3 -->
    <rect x="0" y="72" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="36" y="72" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
    <rect x="72" y="72" width="24" height="24" rx="4" fill="url(#shieldGrad)" />
  </g>

  <!-- Typography: SIAP-LOG -->
  <text x="400" y="660" 
        font-family="'Outfit', 'Segoe UI', Arial, sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#1e3a8a" 
        text-anchor="middle">SIAP-LOG</text>

  <!-- Divider Lines and Subtext -->
  <line x1="140" y1="710" x2="230" y2="710" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" />
  <text x="400" y="718" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#1e3a8a" 
        text-anchor="middle">SESPIMMA LEMDIKLAT POLRI</text>
  <line x1="570" y1="710" x2="660" y2="710" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" />
</svg>
</body>
</html>
